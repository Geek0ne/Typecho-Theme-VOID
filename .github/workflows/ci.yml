name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=${f}::${out}"
              exit 1
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          echo "all PHP files parse"

      - name: Guard against unescaped output of user-controlled fields
        run: |
          if grep -rnE 'echo \$this->fields->(banner|excerpt|thumb)\s*;' \
               --include='*.php' . ; then
            echo "::error::unescaped user field found — wrap it in Utils::esc()"
            exit 1
          fi
          echo "no raw field output detected"

      - name: Verify the esc() helper exists
        run: |
          grep -q 'function esc' libs/Utils.php \
            || { echo "::error::Utils::esc() is missing"; exit 1; }
          echo "Utils::esc() present"

  security-headers:
    name: Security headers shipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .htaccess must define the core headers
        run: |
          set -e
          for h in X-Frame-Options X-Content-Type-Options Referrer-Policy Content-Security-Policy; do
            grep -q "$h" .htaccess || { echo "::error::$h missing from .htaccess"; exit 1; }
          done
          echo "all core headers present"

  seo:
    name: SEO tags present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: canonical and og tags must exist
        run: |
          set -e
          grep -q 'rel="canonical"' includes/head.php || { echo "::error::canonical missing"; exit 1; }
          grep -q 'og:locale'        includes/head.php || { echo "::error::og:locale missing"; exit 1; }
          grep -q 'og:image:alt'     includes/head.php || { echo "::error::og:image:alt missing"; exit 1; }
          echo "SEO tags present"

  # The repository tracks sources, not build output. assets/VOID.scss plus
  # assets/parts/ and assets/libs/ are versioned; the compiled bundle.css,
  # VOID.css, bundle.js and bundle-header.js that the PHP templates load are
  # produced by `npm run build` and are gitignored on purpose — upstream ships
  # them inside VOID-<version>.zip instead.
  #
  # This job therefore does not rebuild. It checks that a fresh clone carries
  # everything needed to build, which is what a deployer actually depends on.
  # (An earlier revision ran `npm ci && npm run build` here; npm aborted with
  # "Exit handler never called!" on the Actions runner on Node 20, Node 22 and
  # ubuntu-22.04 alike, while the same lock file installed in seconds on a
  # normal filesystem — an npm defect under the runner, not a repo problem.)
  asset-sources:
    name: Asset sources complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sass sources present
        run: |
          set -e
          for p in assets/VOID.scss assets/parts assets/libs assets/fonts; do
            [ -e "$p" ] || { echo "::error::$p is missing — a fresh clone cannot build"; exit 1; }
          done
          echo "sass sources present"

      - name: Partials present
        run: |
          set -e
          count=$(find assets/parts -name '*.scss' | wc -l)
          echo "found $count partials"
          [ "$count" -ge 10 ] || { echo "::error::expected >=10 partials, found $count"; exit 1; }

      - name: Vendored libraries present
        run: |
          set -e
          for lib in mathjax prism pjax owo fancybox pangu tocbot; do
            [ -d "assets/libs/$lib" ] || { echo "::error::assets/libs/$lib is missing"; exit 1; }
          done
          echo "vendored libraries present"

      - name: Every asset referenced by the templates resolves
        run: |
          set -e
          missing=0
          refs=$(grep -rhoE "indexTheme\('[^']+'\)" \
                   index.php post.php page.php archive.php Archives.php includes/ \
                 | sed "s/indexTheme('//;s/')//" | sort -u)
          for ref in $refs; do
            case "$ref" in
              */bundle*.js|*/bundle*.css|*/VOID*.css) continue ;;
            esac
            if [ ! -f ".$ref" ]; then
              echo "::error::$ref referenced by a template but absent from the repo"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all template asset references resolve"

      - name: Build instructions are documented
        run: |
          set -e
          if grep -qi "npm run build" SECURITY.md README.md; then
            echo "build instructions are documented"
          else
            echo "::error::neither README.md nor SECURITY.md explains 'npm run build'"
            exit 1
          fi